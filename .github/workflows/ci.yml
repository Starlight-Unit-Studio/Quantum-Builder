name: Quantum Builder CI

on:
  push:
    branches: [main, 'bootstrap/**', 'feature/**', 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax
        run: find src public bin tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Profile versioning regression test
        run: php -d zend.assertions=1 -d assert.exception=1 tests/test_profile_versioning.php

      - name: Python compiler tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Shell syntax
        run: |
          bash -n setup.sh
          bash -n scripts/install.sh
          bash -n scripts/preflight.sh
          bash -n scripts/stack.sh
          bash -n scripts/host-proxy-info.sh

      - name: Curl-pipe installer TTY regression guard
        run: grep -Fq 'docker compose run --rm -T' scripts/install.sh

      - name: Installer source permission regression guard
        run: |
          grep -Fq -- '--chmod=D755,F644' setup.sh
          grep -Fq 'bin/bootstrap.php' setup.sh
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/source/bin" "$tmp/target"
          printf '%s\n' '<?php echo "ok";' > "$tmp/source/bin/bootstrap.php"
          chmod 0750 "$tmp/source" "$tmp/source/bin"
          chmod 0640 "$tmp/source/bin/bootstrap.php"
          rsync -a --chmod=D755,F644 "$tmp/source/" "$tmp/target/"
          test "$(stat -c '%a' "$tmp/target/bin")" = 755
          test "$(stat -c '%a' "$tmp/target/bin/bootstrap.php")" = 644

      - name: Installer version sync regression guard
        run: |
          grep -Fq 'current_version="$(tr -d' scripts/install.sh
          grep -Fq 'QB_VERSION=${current_version}' scripts/install.sh

      - name: Prepare CI environment
        run: |
          cat > .env <<'EOF'
          QB_BIND=127.0.0.1
          QB_HTTP_PORT=8787
          QB_PUBLIC_DOMAIN=builder.example.com
          QB_VERSION=0.1.0-alpha3
          QB_SESSION_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          QB_WRAPPER_REPOSITORY=https://github.com/Starlight-Unit-Studio/Quantum-Mobile-Wrapper.git
          QB_WRAPPER_REF=compat/android-6-api23
          QB_POLL_SECONDS=3
          EOF
          sudo chown 82:82 var
          sudo chmod 0770 var

      - name: Host proxy helper smoke test
        run: |
          output="$(bash scripts/host-proxy-info.sh)"
          printf '%s\n' "$output"
          grep -q 'http://127.0.0.1:8787' <<<"$output"
          grep -q 'https://builder.example.com' <<<"$output"
          grep -q 'KEINE Host-Webserver' <<<"$output"

      - name: Compose validation
        run: docker compose config -q

      - name: Web runtime smoke test
        run: |
          docker compose up -d --build php nginx
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health.php | grep -q '"ok":true'; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs php nginx
          exit 1

      - name: Web entrypoint smoke test
        run: curl -fsS http://127.0.0.1:8787/ | grep -q 'STΛRLIGHT QUANTUM BUILDER'

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color php nginx || true

      - name: Stop smoke stack
        if: always()
        run: docker compose down --remove-orphans || true
