name: Apply canonical production splash patch

on:
  push:
    branches:
      - fix/builder-canonical-production-splash

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic source rewrites
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'docker/worker/Dockerfile',
              'WORKDIR /worker\nCOPY docker/worker/worker.py /worker/worker.py\n\nCMD ["python3", "/worker/worker.py"]\n',
              'WORKDIR /worker\nCOPY docker/worker/worker.py /worker/worker.py\nRUN mkdir -p /worker/assets\nCOPY public/assets/799645628_1052852437562992_1942421779255659784_n-1.webp \\\n     /worker/assets/quantum_production_splash.webp\n\nCMD ["python3", "/worker/worker.py"]\n',
          )

          replace_once(
              'docker/worker/worker.py',
              'SIGNING_ROOT = DATA_DIR / "signing"\n\nGRADLE_PHASES = (',
              'SIGNING_ROOT = DATA_DIR / "signing"\nCANONICAL_PRODUCTION_SPLASH = Path(os.environ.get("QB_CANONICAL_PRODUCTION_SPLASH", "/worker/assets/quantum_production_splash.webp")).resolve()\nCANONICAL_PRODUCTION_SPLASH_SIZE = 112976\n\nGRADLE_PHASES = (',
          )

          replace_once(
              'docker/worker/worker.py',
              '    shutil.rmtree(destination / ".git", ignore_errors=True)\n\n\ndef random_password(length: int = 48) -> str:\n',
              '''    shutil.rmtree(destination / ".git", ignore_errors=True)\n\n\ndef install_mandatory_production_splash(project: Path, output=None) -> Path:\n    source = CANONICAL_PRODUCTION_SPLASH\n    if not source.is_file():\n        raise RuntimeError(f"Mandatory production splash missing: {source}")\n\n    data = source.read_bytes()\n    if len(data) != CANONICAL_PRODUCTION_SPLASH_SIZE:\n        raise RuntimeError(\n            f"Mandatory production splash has unexpected size: {len(data)} bytes "\n            f"(expected {CANONICAL_PRODUCTION_SPLASH_SIZE})"\n        )\n    if len(data) < 12 or data[:4] != b"RIFF" or data[8:12] != b"WEBP":\n        raise RuntimeError("Mandatory production splash is not a valid WebP container")\n\n    drawable_dir = project / "app/src/main/res/drawable-nodpi"\n    drawable_dir.mkdir(parents=True, exist_ok=True)\n    for existing in drawable_dir.glob("quantum_production_splash.*"):\n        existing.unlink()\n\n    target = drawable_dir / "quantum_production_splash.webp"\n    shutil.copy2(source, target)\n    if target.stat().st_size != CANONICAL_PRODUCTION_SPLASH_SIZE:\n        raise RuntimeError("Mandatory production splash copy failed integrity check")\n\n    splash_sha = hashlib.sha256(data).hexdigest()\n    message = (\n        f"Installed mandatory production splash from Quantum Builder source of truth "\n        f"({CANONICAL_PRODUCTION_SPLASH_SIZE} bytes, sha256={splash_sha})"\n    )\n    log(message)\n    if output is not None:\n        output.write(message + "\\n")\n        output.flush()\n    return target\n\n\ndef random_password(length: int = 48) -> str:\n''',
          )

          replace_once(
              'docker/worker/worker.py',
              '        clone_wrapper(project, ref, output)\n\n        update_build(con, build_id, stage="compile-profile", message="Compiling app profile into wrapper")\n',
              '        clone_wrapper(project, ref, output)\n\n        update_build(con, build_id, stage="branding", message="Installing mandatory Starlight production splash")\n        install_mandatory_production_splash(project, output)\n\n        update_build(con, build_id, stage="compile-profile", message="Compiling app profile into wrapper")\n',
          )

          replace_once(
              'tests/test_worker.py',
              'import importlib.util\nimport json\nimport tempfile\n',
              'import importlib.util\nimport io\nimport json\nimport tempfile\n',
          )

          replace_once(
              'tests/test_worker.py',
              '    def test_generated_release_build_uses_staged_gradle_phases(self):\n',
              '''    def test_mandatory_production_splash_replaces_wrapper_copy(self):\n        source = self.root / "canonical.webp"\n        payload = b"RIFF" + b"\\x00\\x00\\x00\\x00" + b"WEBP"\n        payload += b"\\x00" * (worker.CANONICAL_PRODUCTION_SPLASH_SIZE - len(payload))\n        source.write_bytes(payload)\n\n        drawable = self.root / "app/src/main/res/drawable-nodpi"\n        drawable.mkdir(parents=True, exist_ok=True)\n        stale_jpg = drawable / "quantum_production_splash.jpg"\n        stale_jpg.write_bytes(b"stale")\n\n        previous = worker.CANONICAL_PRODUCTION_SPLASH\n        worker.CANONICAL_PRODUCTION_SPLASH = source\n        try:\n            output = io.StringIO()\n            target = worker.install_mandatory_production_splash(self.root, output)\n        finally:\n            worker.CANONICAL_PRODUCTION_SPLASH = previous\n\n        self.assertFalse(stale_jpg.exists())\n        self.assertEqual(target.name, "quantum_production_splash.webp")\n        self.assertEqual(target.read_bytes(), payload)\n        self.assertIn("Installed mandatory production splash", output.getvalue())\n\n    def test_generated_release_build_uses_staged_gradle_phases(self):\n''',
          )
          PY

      - name: Run worker unit tests
        run: python3 -m unittest tests/test_worker.py

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patches/canonical-production-splash.patch
          rmdir .github/patches 2>/dev/null || true
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'Starlight Unit Studios'
          git config user.email 'kontakt@starlight-unit.de'
          git add docker/worker/Dockerfile docker/worker/worker.py tests/test_worker.py .github/patches || true
          git commit -m 'fix: inject canonical production splash during builds'
          git push origin HEAD:fix/builder-canonical-production-splash
