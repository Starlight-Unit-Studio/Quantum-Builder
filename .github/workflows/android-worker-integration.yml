name: Android Worker Integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Prepare builder state
        run: |
          cat > .env <<'EOF'
          QB_BIND=127.0.0.1
          QB_HTTP_PORT=8787
          QB_VERSION=0.1.0-alpha1
          QB_SESSION_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          QB_WRAPPER_REPOSITORY=https://github.com/Starlight-Unit-Studio/Quantum-Mobile-Wrapper.git
          QB_WRAPPER_REF=compat/android-6-api23
          QB_POLL_SECONDS=2
          EOF
          sudo chown 82:82 var
          sudo chmod 0770 var

      - name: Build PHP and Android worker images
        run: docker compose build php worker

      - name: Initialize database
        run: docker compose run --rm -T php php /app/bin/bootstrap.php

      - name: Queue generated app build
        run: |
          sudo sqlite3 var/quantum-builder.sqlite <<'SQL'
          INSERT INTO apps (
            uuid, name, package_id, start_url, description,
            version_name, version_code, min_sdk, target_sdk, config_json
          ) VALUES (
            'ci-generated-app',
            'Quantum CI App',
            'de.starlightunit.quantumci',
            'https://example.com/',
            'CI generated app',
            '0.0.1-ci',
            100,
            23,
            36,
            '{"trusted_domain":"example.com","interface":{"keep_screen_on":false,"orientation":"portrait"},"web":{"user_agent_suffix":" QuantumCI"},"permissions":{"location":false,"microphone":false,"camera":false},"wrapper_ref":"compat/android-6-api23"}'
          );
          INSERT INTO builds (app_id, status, stage, message, wrapper_ref)
          VALUES (1, 'queued', 'queued', 'CI integration build', 'compat/android-6-api23');
          SQL

      - name: Run worker and wait for completion
        run: |
          docker compose up -d worker
          for i in $(seq 1 100); do
            status="$(sudo sqlite3 var/quantum-builder.sqlite "SELECT status FROM builds WHERE id=1;")"
            stage="$(sudo sqlite3 var/quantum-builder.sqlite "SELECT stage FROM builds WHERE id=1;")"
            echo "Build status: ${status:-missing} / ${stage:-missing}"
            if [ "$status" = complete ]; then
              exit 0
            fi
            if [ "$status" = failed ]; then
              sudo sqlite3 var/quantum-builder.sqlite "SELECT message FROM builds WHERE id=1;"
              docker compose logs --no-color worker
              test -f var/builds/1/build.log && tail -n 100 var/builds/1/build.log || true
              exit 1
            fi
            sleep 10
          done
          docker compose logs --no-color worker
          exit 1

      - name: Verify complete artifact set and checksums
        run: |
          test -s var/builds/1/app-release.apk
          test -s var/builds/1/app-release.aab
          test -s var/builds/1/source.zip
          test -s var/builds/1/SHA256SUMS
          cd var/builds/1
          sha256sum -c SHA256SUMS
          if unzip -l source.zip | grep -E '\.(p12|jks|keystore)$|/password$|signing\.properties$'; then
            echo 'Signing material leaked into source archive.' >&2
            exit 1
          fi

      - name: Verify Android identity and signature
        run: |
          docker compose exec -T worker sh -lc '
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose /var/lib/quantum-builder/builds/1/app-release.apk
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging /var/lib/quantum-builder/builds/1/app-release.apk | tee /tmp/badging.txt
            grep -q "package: name=.de.starlightunit.quantumci." /tmp/badging.txt
            grep -q "sdkVersion:.23." /tmp/badging.txt
            grep -q "targetSdkVersion:.36." /tmp/badging.txt
            jarsigner -verify /var/lib/quantum-builder/builds/1/app-release.aab
          '

      - name: Worker logs on failure
        if: failure()
        run: |
          docker compose logs --no-color worker || true
          test -f var/builds/1/build.log && tail -n 150 var/builds/1/build.log || true

      - name: Stop integration stack
        if: always()
        run: docker compose down --remove-orphans || true
