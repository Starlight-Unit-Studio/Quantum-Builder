name: Android Worker Integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Prepare builder state
        run: |
          cat > .env <<'EOF'
          QB_BIND=127.0.0.1
          QB_HTTP_PORT=8787
          QB_VERSION=0.1.0-alpha3
          QB_SESSION_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          QB_WRAPPER_REPOSITORY=https://github.com/Starlight-Unit-Studio/Quantum-Mobile-Wrapper.git
          QB_WRAPPER_REF=compat/android-6-api23
          QB_POLL_SECONDS=2
          EOF
          sudo chown 82:82 var
          sudo chmod 0770 var

      - name: Build PHP and Android worker images
        run: docker compose build php worker

      - name: Initialize database
        run: docker compose run --rm -T php php /app/bin/bootstrap.php

      - name: Queue generated game release build
        run: |
          sudo sqlite3 var/quantum-builder.sqlite <<'SQL'
          INSERT INTO apps (
            uuid, name, package_id, start_url, description,
            version_name, version_code, min_sdk, target_sdk, config_json
          ) VALUES (
            'ci-generated-game-app',
            'Starlight Unit - The Game CI Probe',
            'de.starlightunit.game',
            'https://game.starlight-unit.de/index_01.html',
            'CI generated install probe',
            '0.1.0-ci-probe',
            100,
            23,
            36,
            '{"trusted_domain":"game.starlight-unit.de","interface":{"keep_screen_on":false,"orientation":"portrait"},"web":{"user_agent_suffix":" QuantumCI","custom_headers":{}},"permissions":{"location":false,"microphone":false,"camera":false},"wrapper_ref":"compat/android-6-api23"}'
          );
          INSERT INTO builds (app_id, status, stage, message, wrapper_ref)
          VALUES (1, 'queued', 'queued', 'CI integration build', 'compat/android-6-api23');
          SQL

      - name: Run worker and wait for completion
        run: |
          docker compose up -d worker
          for i in $(seq 1 100); do
            status="$(sudo sqlite3 var/quantum-builder.sqlite "SELECT status FROM builds WHERE id=1;")"
            stage="$(sudo sqlite3 var/quantum-builder.sqlite "SELECT stage FROM builds WHERE id=1;")"
            echo "Build status: ${status:-missing} / ${stage:-missing}"
            if [ "$status" = complete ]; then
              exit 0
            fi
            if [ "$status" = failed ]; then
              sudo sqlite3 var/quantum-builder.sqlite "SELECT message FROM builds WHERE id=1;"
              docker compose logs --no-color worker
              if sudo test -f var/builds/1/build.log; then
                echo '===== Gradle failure markers ====='
                sudo grep -n -E -C 14 'FAILURE:|What went wrong|Execution failed for task|Lint found|(^|[[:space:]])error:|Exception|Caused by:' var/builds/1/build.log || true
                echo '===== Gradle log tail ====='
                sudo tail -n 220 var/builds/1/build.log || true
              fi
              exit 1
            fi
            sleep 10
          done
          docker compose logs --no-color worker
          exit 1

      - name: Verify complete artifact set and checksums
        run: |
          sudo test -s var/builds/1/app-release.apk
          sudo test -s var/builds/1/app-release.aab
          sudo test -s var/builds/1/source.zip
          sudo test -s var/builds/1/SHA256SUMS
          sudo sh -lc 'cd var/builds/1 && sha256sum -c SHA256SUMS'
          if sudo unzip -l var/builds/1/source.zip | grep -E '\.(p12|jks|keystore)$|/password$|signing\.properties$'; then
            echo 'Signing material leaked into source archive.' >&2
            exit 1
          fi

      - name: Verify Android identity and signature
        run: |
          docker compose exec -T worker sh -lc '
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose /var/lib/quantum-builder/builds/1/app-release.apk
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs /var/lib/quantum-builder/builds/1/app-release.apk | tee /tmp/certs.txt
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging /var/lib/quantum-builder/builds/1/app-release.apk | tee /tmp/badging.txt
            grep -q "package: name=.de.starlightunit.game." /tmp/badging.txt
            grep -q "versionCode=.100." /tmp/badging.txt
            grep -q "sdkVersion:.23." /tmp/badging.txt
            grep -q "targetSdkVersion:.36." /tmp/badging.txt
            jarsigner -verify /var/lib/quantum-builder/builds/1/app-release.aab
          '

      - name: Stage install probe in runner-owned directory
        run: |
          rm -rf ci-artifacts
          mkdir -p ci-artifacts
          sudo cp var/builds/1/app-release.apk ci-artifacts/starlight-unit-game-ci-probe.apk
          sudo cp var/builds/1/app-release.aab ci-artifacts/app-release.aab
          sudo cp var/builds/1/SHA256SUMS ci-artifacts/SHA256SUMS
          sudo cp var/builds/1/build.json ci-artifacts/build.json
          sudo chown -R "$(id -u):$(id -g)" ci-artifacts
          chmod -R u+rwX,go+rX ci-artifacts
          test -r ci-artifacts/starlight-unit-game-ci-probe.apk

      - name: Upload generated release probe
        uses: actions/upload-artifact@v4
        with:
          name: quantum-builder-game-release-install-probe
          if-no-files-found: error
          path: ci-artifacts/
          retention-days: 7

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install generated release APK on Android 16 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install ci-artifacts/starlight-unit-game-ci-probe.apk
            adb shell pm path de.starlightunit.game
            adb shell dumpsys package de.starlightunit.game | grep -E 'versionCode=100|versionName=0.1.0-ci-probe'
            adb shell am start -W -n de.starlightunit.game/de.starlightunit.wrapper.MainActivity

      - name: Worker logs on failure
        if: failure()
        run: |
          docker compose logs --no-color worker || true
          if sudo test -f var/builds/1/build.log; then
            echo '===== Gradle failure markers ====='
            sudo grep -n -E -C 14 'FAILURE:|What went wrong|Execution failed for task|Lint found|(^|[[:space:]])error:|Exception|Caused by:' var/builds/1/build.log || true
            echo '===== Gradle log tail ====='
            sudo tail -n 220 var/builds/1/build.log || true
          fi

      - name: Stop integration stack
        if: always()
        run: docker compose down --remove-orphans || true
