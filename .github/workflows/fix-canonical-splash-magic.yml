name: Fix canonical splash format handling

on:
  push:
    branches:
      - fix/builder-canonical-production-splash

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct JPEG format handling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'docker/worker/Dockerfile',
              '/worker/assets/quantum_production_splash.webp',
              '/worker/assets/quantum_production_splash.jpg',
          )
          replace_once(
              'docker/worker/worker.py',
              '"/worker/assets/quantum_production_splash.webp"',
              '"/worker/assets/quantum_production_splash.jpg"',
          )
          replace_once(
              'docker/worker/worker.py',
              '    if len(data) < 12 or data[:4] != b"RIFF" or data[8:12] != b"WEBP":\n        raise RuntimeError("Mandatory production splash is not a valid WebP container")\n',
              '    if len(data) < 3 or data[:3] != b"\\xff\\xd8\\xff":\n        raise RuntimeError("Mandatory production splash is not valid JPEG data")\n',
          )
          replace_once(
              'docker/worker/worker.py',
              '    target = drawable_dir / "quantum_production_splash.webp"\n',
              '    target = drawable_dir / "quantum_production_splash.jpg"\n',
          )
          replace_once(
              'tests/test_worker.py',
              '        source = self.root / "canonical.webp"\n        payload = b"RIFF" + b"\\x00\\x00\\x00\\x00" + b"WEBP"\n        payload += b"\\x00" * (worker.CANONICAL_PRODUCTION_SPLASH_SIZE - len(payload))\n',
              '        source = self.root / "canonical.jpg"\n        payload = b"\\xff\\xd8\\xff\\xe0"\n        payload += b"\\x00" * (worker.CANONICAL_PRODUCTION_SPLASH_SIZE - len(payload))\n',
          )
          replace_once(
              'tests/test_worker.py',
              '        stale_jpg = drawable / "quantum_production_splash.jpg"\n        stale_jpg.write_bytes(b"stale")\n',
              '        stale_webp = drawable / "quantum_production_splash.webp"\n        stale_webp.write_bytes(b"stale")\n',
          )
          replace_once(
              'tests/test_worker.py',
              '        self.assertFalse(stale_jpg.exists())\n        self.assertEqual(target.name, "quantum_production_splash.webp")\n',
              '        self.assertFalse(stale_webp.exists())\n        self.assertEqual(target.name, "quantum_production_splash.jpg")\n',
          )
          PY

      - name: Run worker unit tests
        run: python3 -m unittest tests/test_worker.py

      - name: Commit source corrections
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'Starlight Unit Studios'
          git config user.email 'kontakt@starlight-unit.de'
          git add docker/worker/Dockerfile docker/worker/worker.py tests/test_worker.py
          git commit -m 'fix: package canonical JPEG with correct Android extension'
          git push origin HEAD:fix/builder-canonical-production-splash
